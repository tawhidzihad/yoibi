components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    HealthResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        data:
          type: object
          properties:
            status:
              type: string
              example: healthy
            timestamp:
              type: string
              format: date-time
            database:
              type: string
              example: connected
            version:
              type: string
              example: 1.0.0
        message:
          type: string
          example: Backend service healthy

    UserMeResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        data:
          type: object
          properties:
            id:
              type: string
              example: usr_65e1a2b3
            email:
              type: string
              format: email
              example: user@yoibi.com
            name:
              type: string
              example: Jane Doe
            handle:
              type: string
              example: "@janedoe"
            role:
              type: string
              example: user
              description: "user" | "admin" — never client-assignable
            isBlocked:
              type: boolean
              example: false
            avatarUrl:
              type: string
              nullable: true
              example: https://res.cloudinary.com/.../avatar.jpg
              description: Google users receive the verified provider avatar URL; email users start empty until they upload one.
            bannerUrl:
              type: string
              nullable: true
              example: https://res.cloudinary.com/.../banner.jpg
              description: Profile banner (Cloudinary URL, server-issued signed upload); empty when not set.
            followersCount:
              type: integer
              example: 420
              description: Live follower count from the canonical users document.
            followingCount:
              type: integer
              example: 180
              description: Live following count from the canonical users document.
            tweetsCount:
              type: integer
              example: 112
              description: Real authorId-based tweet count (canonical source shared with the public profile).
            videosCount:
              type: integer
              example: 7
            postsCount:
              type: integer
              example: 112
              description: Legacy alias of tweetsCount (Tweet = YOIBI post type).
            bio:
              type: string
              nullable: true
              example: Building the future of social networks.
            country:
              type: string
              nullable: true
              description: ISO 3166-1 alpha-2 canonical country code.
              example: US
            age:
              type: integer
              nullable: true
              minimum: 16
              example: 21
            phone:
              type: string
              nullable: true
              example: "+1 555 000 1234"
            createdAt:
              type: string
              format: date-time
              example: "2026-09-01T12:00:00.000Z"
              description: Never exposes isEmailVerified (email verification is removed) or any credential fields.
        message:
          type: string

    UserSearchResult:
      type: object
      description: Strict public search-result projection for people search. Never exposes email, role, moderation state, or any other profile detail.
      properties:
        id:
          type: string
          example: usr_65e1a2b3
        handle:
          type: string
          example: janedoe
        name:
          type: string
          example: Jane Doe
        avatarUrl:
          type: string
          description: Cloudinary avatar URL or verified Google avatar URL; empty when none.

    UserPublicProfile:
      type: object
      description: Public profile allowlist. Never exposes email, age, phone, role, block state, or authentication data.
      properties:
        id:
          type: string
          example: usr_65e1a2b3
        handle:
          type: string
          example: "@janedoe"
        name:
          type: string
          example: Jane Doe
        bio:
          type: string
          example: Building the future of social networks.
        country:
          type: string
          description: ISO 3166-1 alpha-2 code (the UI maps codes to display names).
          example: GB
        avatarUrl:
          type: string
          description: Cloudinary avatar URL or verified Google avatar URL.
        bannerUrl:
          type: string
          description: Cloudinary banner/cover URL; empty when the user has no banner.
        followersCount:
          type: integer
          example: 420
        followingCount:
          type: integer
          example: 180
        tweetsCount:
          type: integer
          description: Real count of the user's top-level tweets (canonical authorId ownership).
          example: 112
        videosCount:
          type: integer
          description: Real count of the user's videos.
          example: 7
        postsCount:
          type: integer
          description: Legacy alias of tweetsCount (Tweet is YOIBI's post type).
          example: 112
        isFollowing:
          type: boolean
          example: false
        isOwner:
          type: boolean
          description: True when the authenticated viewer IS this profile's owner.
          example: false
        createdAt:
          type: string
          format: date-time
          example: "2026-09-01T12:00:00.000Z"

    ProfileImageUploadSignature:
      type: object
      description: Server-signed Cloudinary upload authorization for a profile image. NEVER contains the Cloudinary API secret.
      properties:
        uploadIntentId:
