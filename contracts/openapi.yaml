openapi: 3.0.3
info:
  title: YOIBI API Specification
  version: 1.0.0
  description: Official OpenAPI contract for the YOIBI modern social platform.
servers:
  - url: http://localhost:5000/api/v1
    description: Local Development Server
  - url: https://api.yoibi.com/api/v1
    description: Production Server

paths:
  /health:
    get:
      summary: Health check
      description: Returns lightweight server and database health status.
      responses:
        '200':
          description: Service is healthy
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'

  /auth/me:
    get:
      summary: Current authenticated user
      description: Returns the user profile derived from the validated JWT token.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Authenticated user details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserMeResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '403':
          description: Email not verified
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmailNotVerifiedError'

  /auth/verification:
    post:
      summary: Send email verification code
      description: Sends a 6-digit verification code to the user's registered email address. Rate-limited to 1 request per 60 seconds.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Verification code sent
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VerificationSendResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '429':
          description: Rate limit exceeded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RateLimitedError'

  /auth/verification/verify:
    post:
      summary: Verify email with code
      description: Verifies the 6-digit code submitted by the user.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code]
              properties:
                code:
                  type: string
                  pattern: '^\d{6}$'
                  example: "123456"
      responses:
        '200':
          description: Email verified successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VerificationVerifyResponse'
        '400':
          description: Invalid or expired code
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvalidCodeError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'

  /auth/verification/resend:
    post:
      summary: Resend verification code
      description: Resends a verification code with 60-second cooldown enforcement.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Verification code resent
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VerificationResendResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '429':
          description: Cooldown active
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RateLimitedError'

  /users/search:
    get:
      summary: Search users by name or username
      description: Case-insensitive partial match on display name or username. Auth required (protected area — no anonymous enumeration). Blocked accounts are never returned. The query is regex-escaped server-side; a leading "@" is tolerated. Strict public projection (id, handle, name, avatarUrl only). Rate limited 60 req/min/IP.
      security:
        - bearerAuth: []
      parameters:
        - name: q
          in: query
          required: true
          schema:
            type: string
            minLength: 1
            maxLength: 100
          example: "jane"
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 20
            default: 10
      responses:
        '200':
          description: Matching users (ordered by follower count, then handle)
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: object
                    properties:
                      users:
                        type: array
                        items:
                          $ref: '#/components/schemas/UserSearchResult'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '422':
          description: Validation error (missing/over-length q, limit outside 1-20)
        '429':
          description: Search rate limit exceeded

  /users/{handle}:
    get:
      summary: Get user public profile by handle
      description: Returns the public profile with real content counts. The handle is normalized server-side (lowercase, @-stripped). Sensitive fields (email, age, phone, role, block moderation state) are never returned.
      security:
        - bearerAuth: []
      parameters:
        - name: handle
          in: path
          required: true
          schema:
            type: string
            example: "janedoe"
      responses:
        '200':
          description: Public user profile
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    $ref: '#/components/schemas/UserPublicProfile'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '404':
          $ref: '#/components/responses/NotFoundError'

  /users/me/upload-signature:
    post:
      summary: Request server-signed profile-image upload authorization (avatar/banner)
      description: Issues a server-signed Cloudinary upload intent for the authenticated user's avatar or banner. The Cloudinary API secret never leaves the server.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [kind]
              properties:
                kind:
                  type: string
                  enum: [avatar, banner]
      responses:
        '200':
          description: Signed upload parameters (folder-scoped to the user and image kind)
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    $ref: '#/components/schemas/ProfileImageUploadSignature'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '503':
          description: Cloudinary media service is not configured on the server

  /users/me:
    patch:
      summary: Update authenticated user profile
      description: Updates the authenticated user's editable profile fields only. Identity is always the verified req.user.id; role, block state, timestamps and IDs are structurally rejected (Zod strict allowlist).
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  minLength: 1
                  maxLength: 50
                handle:
                  type: string
                  description: Username. Normalized server-side (lowercase, @-stripped, URL-safe [a-z0-9], 3-24 chars). Database-unique; a collision returns 422 HANDLE_TAKEN.
                  example: janedoe
                bio:
                  type: string
                  maxLength: 280
                avatarUrl:
                  type: string
                  description: Cloudinary avatar URL. Empty string clears it.
                bannerUrl:
                  type: string
                  description: Cloudinary banner/cover URL. Empty string clears it.
                country:
                  type: string
                  description: ISO 3166-1 alpha-2 code (uppercase, canonical). Empty string clears the field.
                  example: US
                age:
                  type: integer
                  description: YOIBI onboarding policy requires age >= 16. Null/empty clears the field (Google users start empty and complete it later).
                  minimum: 16
                  maximum: 120
                  nullable: true
                phone:
                  type: string
                  description: Optional telephone number. Empty string clears the field.
                  example: "+1 555 000 1234"
              additionalProperties: false
      responses:
        '200':
          description: Profile updated successfully
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '422':
          description: Validation error or username already taken (code HANDLE_TAKEN)

  /users/{id}/follow:
    post:
      summary: Follow a user
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: User followed successfully
    delete:
      summary: Unfollow a user
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: User unfollowed successfully

  /users/suggested:
    get:
      summary: Get suggested accounts to follow
      responses:
        '200':
          description: Suggested accounts list

  /tweets/config:
    get:
      summary: Get tweet client configuration and constraints
      description: Returns server-enforced tweet constraints (maxLength, maxMediaCount).
      responses:
        '200':
          description: Tweet configuration
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: object
                    properties:
                      maxLength:
                        type: integer
                        example: 380
                      maxMediaCount:
                        type: integer
                        example: 5

  /tweets:
    get:
      summary: List micro-post tweets
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
        - name: mode
          in: query
          schema:
            type: string
            enum: [feed, tweets]
          description: Opt-in feed discovery mode with seeded randomization and own-post pinning
        - name: seed
          in: query
          schema:
            type: integer
          description: Feed session PRNG seed for deterministic pagination
        - name: cursor
          in: query
          schema:
            type: string
        - name: filter
          in: query
          schema:
            type: string
            enum: [all, following]
            default: all
        - name: authorHandle
          in: query
          schema:
            type: string
      responses:
        '200':
          description: Paginated tweets list
    post:
      summary: Create a tweet
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [content]
              properties:
                content:
                  type: string
                  maxLength: 380
                media:
                  type: array
                  maxItems: 5
                  description: Server-authorized image attachments (max 5). Each entry references a server-issued upload intent.
                  items:
                    type: object
                    required: [uploadIntentId, publicId, url]
                    properties:
                      uploadIntentId:
                        type: string
                      publicId:
                        type: string
                        description: yoibi/tweets/{userId}/intent_tweetimg_...
                      url:
                        type: string
                        format: uri
                      type:
                        type: string
                        enum: [image]
                        default: image
                      width:
                        type: integer
                      height:
                        type: integer
                      bytes:
                        type: integer
                      format:
                        type: string
                        enum: [jpg, jpeg, png, webp, avif, gif]
                replyToId:
                  type: string
                  nullable: true
      responses:
        '201':
          description: Tweet published

  /tweets/media-signature:
    post:
      summary: Request server-signed Cloudinary upload parameters for one tweet image
      description: >
        Returns server-signed upload parameters for ONE image of the authenticated user.
        The signature covers public_id + timestamp only; publicId already embeds the
        server-controlled folder. Clients must NOT send `folder` as a separate upload
        parameter — Cloudinary prepends `folder` to `public_id` when both are sent,
        doubling the asset path and failing strict provenance verification. The `folder`
        field is informational only. NEVER contains the Cloudinary API secret.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Signed upload parameters generated
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: object
                    properties:
                      uploadIntentId:
                        type: string
                        example: "intent_tweetimg_1726000000_a1b2c3d4"
                      publicId:
                        type: string
                        example: "yoibi/tweets/usr_65e1a2b3/intent_tweetimg_1726000000_a1b2c3d4"
                      folder:
                        type: string
                        example: "yoibi/tweets/usr_65e1a2b3"
                      timestamp:
                        type: integer
                        example: 1726000000
                      signature:
                        type: string
                        example: "3f8b8..."
                      apiKey:
                        type: string
                        example: "123456789"
                      cloudName:
                        type: string
                        example: "yoibi"

  /tweets/{id}:
    get:
      summary: Get tweet details
      description: >
        Tweet details with the threaded comment tree (same shape as
        GET /tweets/{id}/replies — top-level comments, each carrying a flat
        chronological `replies` array with all descendants).
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Tweet details
    delete:
      summary: Delete a tweet
      description: >
        Deletes the tweet. If the target is a top-level tweet its entire
        comment thread is cascade-deleted; if it is a comment, the comment and
        all of its nested replies (subtree) are removed. Author or admin only.
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Tweet deleted (data includes deletedId and deletedCount)

  /tweets/{id}/like:
    post:
      summary: Like a tweet or comment
      description: >
        :id may be a tweet OR a comment (comments are tweets). Adds the
        authenticated user to the target's likes (idempotent per user).
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Target liked (data includes liked and likesCount)
    delete:
      summary: Unlike a tweet or comment
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Target unliked (data includes liked and likesCount)

  /tweets/{id}/retweet:
    post:
      summary: Retweet
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Retweet registered
    delete:
      summary: Undo retweet
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Retweet removed

  /tweets/{id}/replies:
    get:
      summary: Get a tweet's threaded comment tree
      description: >
        Returns the top-level comments (direct replies) of the tweet, each
        carrying a flat chronological `replies` array with ALL of its
        descendants (any depth — depth >= 2 is flattened into the same
        group, Facebook-style). Each nested reply carries `parentAuthor`
        (author of the comment it directly replied to). Comments are
        individually likable; every item exposes `liked` for the viewer.
        Legacy pre-threading replies are backfilled to rootTweetId on read.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: >
            Threaded comment list — data.items is an array of top-level
            comments, each with a nested flat `replies` array. Comment
            fields include id, content, author, createdAt, likesCount,
            liked, repliesCount, replyToId, rootTweetId, rootCommentId
            (and parentAuthor on nested replies).
    post:
      summary: Reply to a tweet or comment (threaded)
      description: >
        :id may be a tweet (creates a top-level comment) or a comment
        (creates a nested reply). The parent relationship (replyToId) and
        the thread roots (rootTweetId, rootCommentId) are derived
        SERVER-SIDE from the URL :id and the stored parent chain — never
        from the client body. A nested reply increments both the parent
        comment's direct-reply count and the root tweet's total comment
        count.
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [content]
              properties:
                content:
                  type: string
                  maxLength: 380
                media:
                  type: array
                  maxItems: 5
                  items:
                    type: object
                    required: [uploadIntentId, publicId, url]
                    properties:
                      uploadIntentId:
                        type: string
                      publicId:
                        type: string
                      url:
                        type: string
                        format: uri
                      type:
                        type: string
                        enum: [image]
                        default: image
                      width:
                        type: integer
                      height:
                        type: integer
                      bytes:
                        type: integer
                      format:
                        type: string
                        enum: [jpg, jpeg, png, webp, avif, gif]
      responses:
        '201':
          description: Reply tweet created


  /media/upload:
    post:
      summary: Upload image or video asset via server-side Cloudinary SDK
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
                folder:
                  type: string
                  enum: [posts, tweets, avatars, videos]
      responses:
        '201':
          description: Media uploaded successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MediaUploadResponse'
        '413':
          description: File exceeds size limits (10MB image, 100MB video)
        '415':
          description: Unsupported media type

  /videos/upload-signature:
    post:
      summary: Request signed Cloudinary upload parameters and server upload intent
      description: >
        Returns server-signed upload parameters. The signature covers public_id + timestamp only;
        publicId already embeds the server-controlled folder. Clients must NOT send `folder` as a
        separate upload parameter — Cloudinary prepends `folder` to `public_id` when both are sent,
        doubling the asset path and failing strict provenance verification. The `folder` field is
        informational only. NEVER contains the Cloudinary API secret.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Signed upload parameters generated
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: object
                    properties:
                      uploadIntentId:
                        type: string
                        example: "intent_vid_1726000000_a1b2c3d4"
                      publicId:
                        type: string
                        example: "yoibi/videos/usr_65e1a2b3/intent_vid_1726000000_a1b2c3d4"
                      folder:
                        type: string
                        example: "yoibi/videos/usr_65e1a2b3"
                      timestamp:
                        type: integer
                        example: 1726000000
                      signature:
                        type: string
                        example: "3f8b8..."
                      apiKey:
                        type: string
                        example: "123456789"
                      cloudName:
                        type: string
                        example: "yoibi"

  /videos:
    get:
      summary: List community videos
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
        - name: category
          in: query
          schema:
            type: string
            enum: [politics, current-events, learning, governmental, fun, conversations, commentary, news]
        - name: search
          in: query
          schema:
            type: string
        - name: authorId
          in: query
          schema:
            type: string
      responses:
        '200':
          description: Paginated videos list
    post:
      summary: Register uploaded video metadata
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [uploadIntentId, title, videoUrl]
              properties:
                uploadIntentId:
                  type: string
                publicId:
                  type: string
                  description: Exact Cloudinary public_id returned by the upload; must match the server-issued intent.
                title:
                  type: string
                  minLength: 3
                  maxLength: 120
                description:
                  type: string
                  maxLength: 2000
                category:
                  type: string
                  enum: [politics, current-events, learning, governmental, fun, conversations, commentary, news]
                videoUrl:
                  type: string
                thumbnailUrl:
                  type: string
                duration:
                  type: number
                bytes:
                  type: integer
                  maximum: 104857600
                width:
                  type: integer
                height:
                  type: integer
                format:
                  type: string
                  enum: [mp4, webm, mov, quicktime]
      responses:
        '201':
          description: Video registered successfully
        '403':
          description: Upload intent does not belong to user or is invalid
        '422':
          description: Validation error

  /videos/{id}:
    get:
      summary: Get single video metadata (read-only, does NOT increment viewsCount)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Video metadata details
        '404':
          description: Video not found
    delete:
      summary: Delete a video and remove external Cloudinary media
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Video deleted successfully
        '403':
          description: Forbidden

  /videos/{id}/view:
    post:
      summary: Record video playback initiation event (increments viewsCount)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Playback event recorded
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: object
                    properties:
                      viewsCount:
                        type: integer
                        example: 12401

  /videos/{id}/like:
    post:
      summary: Like a video
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Video liked
    delete:
      summary: Unlike a video
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Video unliked

  /meetup/rooms:
    get:
      summary: List collaborative meetup rooms
      parameters:
        - name: status
          in: query
          required: false
          schema:
            type: string
            enum: [active, ended, all]
            default: active
        - name: page
          in: query
          required: false
          schema:
            type: integer
            default: 1
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            default: 20
      responses:
        '200':
          description: Meet-Up rooms list
    post:
      summary: Create collaborative meetup room
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name:
                  type: string
                  minLength: 3
                  maxLength: 100
                  example: Frontend Architecture Discussion
                topic:
                  type: string
                  maxLength: 100
                  example: Next.js App Router & Tailwind v4
                maxParticipants:
                  type: integer
                  minimum: 2
                  maximum: 50
                  default: 12
      responses:
        '201':
          description: Room created with host participant token
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'

  /meetup/rooms/{roomId}:
    get:
      summary: Get meetup room details by ID
      parameters:
        - name: roomId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Room details and active participant status
        '404':
          $ref: '#/components/responses/NotFoundError'
    delete:
      summary: Permanently delete meetup room (ended state only)
      security:
        - bearerAuth: []
      parameters:
        - name: roomId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Meet-Up room deleted
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          description: Forbidden or room is currently active (ROOM_ACTIVE)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '404':
          $ref: '#/components/responses/NotFoundError'

  /meetup/rooms/{roomId}/join:
    post:
      summary: Join collaborative meetup room and obtain LiveKit participant token
      security:
        - bearerAuth: []
      parameters:
        - name: roomId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Interactive participant token generated (canPublish true, canSubscribe true, roomAdmin false)
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
