  # Email Verification Schemas
    VerificationSendResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        data:
          type: object
          properties:
            sent:
              type: boolean
              example: true
        message:
          type: string
          example: Verification code sent to your email

    VerificationVerifyResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        data:
          type: object
          properties:
            verified:
              type: boolean
              example: true
            emailVerified:
              type: boolean
              example: true
        message:
          type: string
          example: Email verified successfully

    VerificationResendResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        data:
          type: object
          properties:
            resent:
              type: boolean
              example: true
        message:
          type: string
          example: Verification code resent

    EmailNotVerifiedError:
      type: object
      properties:
        success:
          type: boolean
          example: false
        error:
          type: object
          properties:
            code:
              type: string
              example: EMAIL_NOT_VERIFIED
            message:
              type: string
              example: Please verify your email address to continue.

    InvalidCodeError:
      type: object
      properties:
        success:
          type: boolean
          example: false
        error:
          type: object
          properties:
            code:
              type: string
              example: INVALID_CODE
            message:
              type: string
              example: Invalid verification code.

    RateLimitedError:
      type: object
      properties:
        success:
          type: boolean
          example: false
        error:
          type: object
          properties:
            code:
              type: string
              example: RATE_LIMITED
            message:
              type: string
              example: Too many requests. Please wait before sending again.

  responses:
    UnauthorizedError:
      description: Access token missing or invalid
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    ForbiddenError:
      description: Access denied or insufficient role
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    NotFoundError:
      description: Resource was not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    EmailNotVerifiedError:
      description: Email verification required
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/EmailNotVerifiedError'
